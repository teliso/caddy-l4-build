name: Build Caddy L4 Image

on:
  workflow_dispatch:

env:
  CADDY_VERSION: v2.11.4
  CADDY_L4_VERSION: v0.1.2
  XCADDY_VERSION: v0.4.5
  GO_VERSION: '1.26.3'

  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/caddy-l4

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}

      - name: Build Caddy with Layer4
        run: |
          xcaddy build ${CADDY_VERSION} \
            --with github.com/mholt/caddy-l4@${CADDY_L4_VERSION} \
            --output caddy

      - name: Verify
        run: |
          ./caddy version
          ./caddy list-modules --versions | grep layer4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.CADDY_VERSION }}-l4-${{ env.CADDY_L4_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
